# .github/workflows/ci.yml
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Ruby ${{ matrix.ruby-version }} / Rails ${{ matrix.rails-version }}
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: ${{ matrix.gemfile }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby-version: "3.3"
            rails-version: "8.0"
            gemfile: gemfiles/rails_8_0.gemfile
          - ruby-version: "3.3"
            rails-version: "8.1"
            gemfile: gemfiles/rails_8_1.gemfile
          - ruby-version: "3.4"
            rails-version: "8.1"
            gemfile: gemfiles/rails_8_1.gemfile
          - ruby-version: "4.0"
            rails-version: "8.1"
            gemfile: gemfiles/rails_8_1.gemfile

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Run tests
        run: bundle exec rake test

      - name: Validate RBS signatures
        run: bundle exec rbs validate

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-ruby-${{ matrix.ruby-version }}-rails-${{ matrix.rails-version }}
          path: coverage/
          if-no-files-found: error
